version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-algo_trading}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: applies pending migrations, then exits. `depends_on: condition:
  # service_completed_successfully` on api/worker means they won't boot
  # against a schema that isn't there yet.
  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Scale with: docker compose up --scale api=3
  # Put a load balancer (nginx/Traefik/your cloud LB) in front of these replicas.
  api:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Scale with: docker compose up --scale worker=3
  # Workers are stateless job consumers — scale this independently of `api`
  # based on broker-sync volume (many connected accounts) rather than HTTP traffic.
  worker:
    build:
      context: .
      target: runtime
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  postgres_data:
  redis_data:
